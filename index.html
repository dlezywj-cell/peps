function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }
function getLocalDB() { try { return JSON.parse(localStorage.getItem(DB_KEY) || '{}'); } catch(e) { return {}; } }
function getFromDB(code, year) { const db = getLocalDB(); return (db[code] && db[code][year]) || null; }

function mergeEntryByTs(localEntry, cloudEntry) {
    if (!localEntry) return cloudEntry || null;
    if (!cloudEntry) return localEntry || null;
    return (cloudEntry.ts || 0) > (localEntry.ts || 0) ? cloudEntry : localEntry;
}

function mergeStockRecord(localRecord = {}, cloudRecord = {}) {
    const merged = {};
    const keys = new Set([...Object.keys(localRecord || {}), ...Object.keys(cloudRecord || {})]);

    keys.forEach(key => {
        if (key === '__forecast') {
            const localForecast = localRecord.__forecast || {};
            const cloudForecast = cloudRecord.__forecast || {};
            const mergedForecast = {};
            const forecastYears = new Set([...Object.keys(localForecast), ...Object.keys(cloudForecast)]);
            forecastYears.forEach(year => {
                const mergedEntry = mergeEntryByTs(localForecast[year], cloudForecast[year]);
                if (mergedEntry) mergedForecast[year] = mergedEntry;
            });
            if (Object.keys(mergedForecast).length > 0) merged.__forecast = mergedForecast;
            return;
        }

        if (key === '__forecastHistory') {
            const localHistory = localRecord.__forecastHistory || {};
            const cloudHistory = cloudRecord.__forecastHistory || {};
            const mergedHistory = {};
            const historyYears = new Set([...Object.keys(localHistory), ...Object.keys(cloudHistory)]);
            historyYears.forEach(year => {
                const localItems = Array.isArray(localHistory[year]) ? localHistory[year] : [];
                const cloudItems = Array.isArray(cloudHistory[year]) ? cloudHistory[year] : [];
                const deduped = [...localItems, ...cloudItems].reduce((acc, item) => {
                    if (!item || item.ts == null) return acc;
                    const dayKey = item.day || getHistoryDayKey(item.ts);
                    if (!acc[dayKey] || (item.ts || 0) > (acc[dayKey].ts || 0)) acc[dayKey] = item;
                    return acc;
                }, {});
                const mergedItems = Object.values(deduped).sort((a, b) => (a.ts || 0) - (b.ts || 0));
                if (mergedItems.length > 0) mergedHistory[year] = mergedItems;
            });
            if (Object.keys(mergedHistory).length > 0) merged.__forecastHistory = mergedHistory;
            return;
        }

        if (key === '__manualHistory') {
            const localHistory = localRecord.__manualHistory || {};
            const cloudHistory = cloudRecord.__manualHistory || {};
            const mergedHistory = {};
            const historyYears = new Set([...Object.keys(localHistory), ...Object.keys(cloudHistory)]);
            historyYears.forEach(year => {
                const localItems = Array.isArray(localHistory[year]) ? localHistory[year] : [];
                const cloudItems = Array.isArray(cloudHistory[year]) ? cloudHistory[year] : [];
                const deduped = [...localItems, ...cloudItems].reduce((acc, item) => {
                    if (!item || item.ts == null) return acc;
                    const dayKey = item.day || getHistoryDayKey(item.ts);
                    if (!acc[dayKey] || (item.ts || 0) > (acc[dayKey].ts || 0)) acc[dayKey] = item;
                    return acc;
                }, {});
                const mergedItems = Object.values(deduped).sort((a, b) => (a.ts || 0) - (b.ts || 0));
                if (mergedItems.length > 0) mergedHistory[year] = mergedItems;
            });
            if (Object.keys(mergedHistory).length > 0) merged.__manualHistory = mergedHistory;
            return;
        }

        const mergedEntry = mergeEntryByTs(localRecord[key], cloudRecord[key]);
        if (mergedEntry) merged[key] = mergedEntry;
    });

    return merged;
}

function mergeDatabases(localDB = {}, cloudDB = {}) {
    const merged = {};
    const stockCodes = new Set([...Object.keys(localDB || {}), ...Object.keys(cloudDB || {})]);
    stockCodes.forEach(code => {
        merged[code] = mergeStockRecord(localDB[code] || {}, cloudDB[code] || {});
    });
    return merged;
}

async function saveToDB(code, year, rev, prof, immediateSync = true) {
    const db = getLocalDB();
    if (!db[code]) db[code] = {};
    if (!db[code].__manualHistory) db[code].__manualHistory = {};
    const ts = Date.now();
    const previous = db[code][year];
    const baselineDay = `${year}-01-01`;
    const seededHistory = seedPreviousFinancialValue(
        db[code].__manualHistory[year], previous, rev, prof, baselineDay
    );
    db[code][year] = { rev, prof, ts };
    db[code].__manualHistory[year] = upsertHistoryEntry(seededHistory, { rev, prof, ts });
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    if (immediateSync) triggerSync();
}

function triggerSync() {
    if (!ghConfig.token || !ghConfig.user || !ghConfig.repo) {
        showToast('✅ 已保存到本地', 'ok');
        return;
    }
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
        updateStatus('syncing', '上传中');
        try {
            const apiUrl = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/${ghConfig.file}`;
            const localDB = getLocalDB();
            let cloudDB = {};
            const getRes = await fetch(apiUrl, {
                headers: { 'Authorization': `token ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            let sha = null;
            if (getRes.ok) {
                const cloudFile = await getRes.json();
                sha = cloudFile.sha;
                cloudDB = JSON.parse(b64_to_utf8(cloudFile.content.replace(/\n/g, '')));
            }
            const mergedDB = mergeDatabases(localDB, cloudDB);
            localStorage.setItem(DB_KEY, JSON.stringify(mergedDB));

            const putRes = await fetch(apiUrl, {
                method : 'PUT',
                headers: {
                    'Authorization': `token ${ghConfig.token}`,
                    'Content-Type' : 'application/json',
                    'Accept'       : 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `update ${currentStock.code || 'data'}`,
                    content: utf8_to_b64(JSON.stringify(mergedDB)),
                    sha
                })
            });
            if (putRes.ok) {
                updateStatus('online', '已同步');
                showToast('✅ 数据已同步到 GitHub', 'ok');
            } else {
                const err = await putRes.json();
                throw new Error(err.message || putRes.statusText);
            }
        } catch (e) {
            console.error('[triggerSync]', e);
            updateStatus('error', '同步失败');
            showToast('⚠️ GitHub 同步失败：' + e.message, 'warn');
        }
    }, 1500);
}

async function autoSyncFromCloud() {
    if (!ghConfig.token || !ghConfig.user || !ghConfig.repo) return;
    updateStatus('syncing', '同步中');
    try {
        const apiUrl = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/${ghConfig.file}?t=${Date.now()}`;
        const res = await fetch(apiUrl, {
            headers: { 'Authorization': `token ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.ok) {
            const data    = await res.json();
            const cloudDB = JSON.parse(b64_to_utf8(data.content.replace(/\n/g, '')));
            const merged  = mergeDatabases(getLocalDB(), cloudDB);
            localStorage.setItem(DB_KEY, JSON.stringify(merged));
            updateStatus('online', '已同步');
        } else if (res.status === 404) {
            updateStatus('online', '新仓库');
        } else {
            const err = await res.json();
            throw new Error(err.message);
        }
    } catch (e) {
        console.warn('[autoSyncFromCloud]', e.message);
        updateStatus('error', '同步失败');
    }
}

    localStorage.setItem('stock_user',  ghConfig.user);
    localStorage.setItem('stock_repo',  ghConfig.repo);
    closeSettings();
    autoSyncFromCloud();
};

// ============================================================
// 图表区间快捷键
// ============================================================
function setChartHorizontalPadding(chart, left, right) {
    const layout = chart.options.layout || {};
    const currentPadding = (layout.padding && typeof layout.padding === 'object')
        ? layout.padding
        : {};
    chart.options.layout = {
        ...layout,
        padding: { ...currentPadding, left, right }
    };
}

function synchronizeSharedXAxisLayout() {
    if (!chartInstance || !forecastHistoryChartInstance) return;

    const charts = [chartInstance, forecastHistoryChartInstance];
    // 先移除上一次补偿，再根据两张图各自纵轴占用的宽度重新计算。
    charts.forEach(chart => {
        setChartHorizontalPadding(chart, 0, 0);
        chart.update('none');
    });

    const targetLeft = Math.max(...charts.map(chart => chart.chartArea.left));
    const targetRightGutter = Math.max(...charts.map(chart => chart.width - chart.chartArea.right));

    charts.forEach(chart => {
        const leftPadding = Math.max(0, targetLeft - chart.chartArea.left);
        const rightPadding = Math.max(0, targetRightGutter - (chart.width - chart.chartArea.right));
        setChartHorizontalPadding(chart, leftPadding, rightPadding);
        chart.update('none');
    });
}

function scheduleSharedXAxisLayout() {
    if (sharedXAxisSyncFrame != null) cancelAnimationFrame(sharedXAxisSyncFrame);
    sharedXAxisSyncFrame = requestAnimationFrame(() => {
        sharedXAxisSyncFrame = null;
        synchronizeSharedXAxisLayout();
    });
}

function syncSharedChartRangeFrom(sourceChart) {
    const targetChart = sourceChart === chartInstance
        ? forecastHistoryChartInstance
        : chartInstance;
    if (!sourceChart?.scales?.x || !targetChart) return;

    targetChart.options.scales.x.min = sourceChart.scales.x.min;
    targetChart.options.scales.x.max = sourceChart.scales.x.max;
    targetChart.update('none');
    scheduleSharedXAxisLayout();
}

function applySharedChartRange(min, max) {
    [chartInstance, forecastHistoryChartInstance].filter(Boolean).forEach(chart => {
        if (typeof chart.resetZoom === 'function') chart.resetZoom();
        chart.options.scales.x.min = min;
        chart.options.scales.x.max = max;
        chart.update();
    });
    scheduleSharedXAxisLayout();
}

window.addEventListener('resize', scheduleSharedXAxisLayout);

window.setChartRange = function(type, evt) {
    if (!chartInstance || !globalData.length) return;

    document.querySelectorAll('.range-selector button').forEach(btn => btn.classList.remove('active'));
    const clickedBtn = evt?.currentTarget || document.getElementById('btn-range-all');
    if (clickedBtn) clickedBtn.classList.add('active');

    const latestDateStr = globalData[globalData.length - 1].date;
    const latestDate = new Date(latestDateStr);
    let minDate = null;

    if (type === '1y') {
        minDate = new Date(latestDate);
        minDate.setFullYear(minDate.getFullYear() - 1);
    } else if (type === '3y') {
        minDate = new Date(latestDate);
        minDate.setFullYear(minDate.getFullYear() - 3);
    } else if (type === '5y') {
        minDate = new Date(latestDate);
        minDate.setFullYear(minDate.getFullYear() - 5);
    } else if (type === 'input') {
        const startDate = document.getElementById('displayStartDate').value;
        const endDate = document.getElementById('displayEndDate').value;
        if (!startDate || !endDate) {
            showToast('请先输入显示开始和结束日期', 'warn');
            return;
        }
        if (startDate > endDate) {
            showToast('显示开始日期不能晚于结束日期', 'warn');
            return;
        }
        applySharedChartRange(startDate, endDate);
        return;
    } else {
        applySharedChartRange(undefined, undefined);
        return;
    }

    const minDateStr = minDate.toISOString().split('T')[0];
    applySharedChartRange(minDateStr, latestDateStr);
};

function resetZoom() { applySharedChartRange(undefined, undefined); }

const crosshairPlugin = {
    id: 'crosshair',
    afterEvent(chart, args) {
        const event = args.event;
        const area = chart.chartArea;

        if (!event || !area) {
            chart.$crosshair = null;
            return;
        }

        const inside =
            event.x >= area.left &&
            event.x <= area.right &&
            event.y >= area.top &&
            event.y <= area.bottom;

        chart.$crosshair = inside ? { x: event.x, y: event.y } : null;
        // 十字光标本身不是 Chart.js 数据元素，需要显式触发重绘。
        args.changed = true;
    },
    afterDraw(chart) {
        if (!chart.tooltip?._active?.length || !chart.$crosshair) return;

        const ctx = chart.ctx;
        const { y } = chart.$crosshair;
        const { left, right, top, bottom } = chart.chartArea;
        const activePoint = chart.tooltip._active[0];
        // 竖线吸附到 tooltip 当前选中的交易日，确保线、日期和提示框一致。
        const x = activePoint?.element?.x ?? chart.$crosshair.x;

        const drawAxisTag = ({ text, centerX, topY, background, align = 'center' }) => {
            ctx.save();
            ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            const paddingX = 6;
            const height = 20;
            const width = Math.ceil(ctx.measureText(text).width) + paddingX * 2;
            let tagLeft = align === 'right'
                ? centerX - width
                : (align === 'left' ? centerX : centerX - width / 2);
            tagLeft = Math.max(2, Math.min(tagLeft, chart.width - width - 2));

            ctx.fillStyle = background;
            ctx.beginPath();
            ctx.roundRect(tagLeft, topY, width, height, 4);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, tagLeft + width / 2, topY + height / 2);
            ctx.restore();
        };

        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(100,100,100,0.5)';

        ctx.moveTo(x, top);
        ctx.lineTo(x, bottom);

        ctx.moveTo(left, y);
        ctx.lineTo(right, y);

        ctx.stroke();
        ctx.restore();

        const dataIndex = activePoint?.index ?? activePoint?.element?.$context?.dataIndex;
        const dateLabel = chart.data.labels?.[dataIndex] || '';
        if (dateLabel) {
            drawAxisTag({
                text: dateLabel,
                centerX: x,
                topY: Math.min(bottom + 4, chart.height - 22),
                background: '#5d6d7e'
            });
        }

        const psScale = chart.scales.y_ps;
        const peScale = chart.scales.y_pe;
        const peDatasetIndex = chart.data.datasets.findIndex(dataset => dataset.label === 'PE（右轴）');
        const psDatasetIndex = chart.data.datasets.findIndex(dataset => dataset.label === 'PS（左轴）');
        const isPeVisible = peDatasetIndex >= 0 && chart.isDatasetVisible(peDatasetIndex);
        const isPsVisible = psDatasetIndex >= 0 && chart.isDatasetVisible(psDatasetIndex);

        if (psScale && isPsVisible) {
            drawAxisTag({
                text: `PS ${psScale.getValueForPixel(y).toFixed(2)}`,
                centerX: left - 3,
                topY: y - 10,
                background: '#2980b9',
                align: 'right'
            });
        }
        if (peScale && isPeVisible) {
            drawAxisTag({
                text: `PE ${peScale.getValueForPixel(y).toFixed(2)}`,
                centerX: right + 3,
                topY: y - 10,
                background: '#c0392b',
                align: 'left'
            });
        }
    }
};

function getRecordedFinancialForDate(year, date, timelines = null) {
    if (!currentStock.code || !year) return null;
    const historyTimelines = timelines || buildFinancialHistoryTimelines(currentStock.code);
    return findFinancialRecordForDate(historyTimelines[year], date);
}

function toElasticScale(value) {
    if (value == null) return null;
    return Math.sign(value) * Math.log10(1 + Math.abs(value));
}

function fromElasticScale(value) {
    if (!value) return 0;
    return Math.sign(value) * (Math.pow(10, Math.abs(value)) - 1);
}

function formatFinancialAxisValue(value) {
    const abs = Math.abs(value);
    const digits = abs >= 100 ? 0 : (abs >= 10 ? 1 : 2);
    return value.toLocaleString('zh-CN', { maximumFractionDigits: digits });
}

function renderForecastHistoryChart() {
    const wrap = document.getElementById('forecastHistoryWrap');
    const canvas = document.getElementById('forecastHistoryChart');
    if (!wrap || !canvas) return;

    const metric = forecastHistoryMetric === 'prof' ? 'prof' : 'rev';
    const fw2Metric = metric === 'rev' ? 'fw2rev' : 'fw2prof';
    const financialHistoryTimelines = buildFinancialHistoryTimelines(currentStock.code);
    const fw1RawData = globalData.map(item => {
        const year = item.year || parseInt(item.date.substring(0, 4));
        const timeline = financialHistoryTimelines[year] || [];
        const recorded = getRecordedFinancialForDate(year, item.date, financialHistoryTimelines);
        const value = recorded ? recorded[metric] : (timeline.length ? null : item[metric]);
        return value != null ? +(value / 1e8).toFixed(2) : null;
    });
    const fw2RawData = globalData.map(item => {
        const year = item.fw2year || (parseInt(item.date.substring(0, 4)) + 1);
        const timeline = financialHistoryTimelines[year] || [];
        const recorded = getRecordedFinancialForDate(year, item.date, financialHistoryTimelines);
        const value = recorded ? recorded[metric] : (timeline.length ? null : item[fw2Metric]);
        return value != null ? +(value / 1e8).toFixed(2) : null;
    });
    const hasData = fw1RawData.some(value => value != null) || fw2RawData.some(value => value != null);

    wrap.style.display = hasData ? 'block' : 'none';
    if (forecastHistoryChartInstance) {
        forecastHistoryChartInstance.destroy();
        forecastHistoryChartInstance = null;
    }
    if (!hasData) return;

    const metricLabel = metric === 'rev' ? '收入' : '净利';
    const scaleMode = forecastHistoryScaleByMetric[metric] || 'linear';
    const isElastic = scaleMode === 'elastic';
    const fw1Data = isElastic ? fw1RawData.map(toElasticScale) : fw1RawData;
    const fw2Data = isElastic ? fw2RawData.map(toElasticScale) : fw2RawData;
    const metricAxisLabel = `${metricLabel}(亿${isElastic ? '，弹性刻度' : ''})`;
    const btnRev = document.getElementById('btn-history-rev');
    const btnProf = document.getElementById('btn-history-prof');
    const btnLinear = document.getElementById('btn-history-linear');
    const btnElastic = document.getElementById('btn-history-elastic');
    if (btnRev) btnRev.classList.toggle('active', metric === 'rev');
    if (btnProf) btnProf.classList.toggle('active', metric === 'prof');
    if (btnLinear) btnLinear.classList.toggle('active', !isElastic);
    if (btnElastic) btnElastic.classList.toggle('active', isElastic);

    const ctx = canvas.getContext('2d');
    forecastHistoryChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: globalData.map(item => item.date),
            datasets: [
                {
                    label: `FW1 ${metricLabel}（当年）`,
                    data: fw1Data,
                    borderColor: '#d35400',
                    backgroundColor: 'rgba(211,84,0,0.08)',
                    borderWidth: 1.8,
                    stepped: 'before',
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    spanGaps: true
                },
                {
                    label: `FW2 ${metricLabel}（下一年）`,
                    data: fw2Data,
                    borderColor: '#16a085',
                    backgroundColor: 'rgba(22,160,133,0.08)',
                    borderWidth: 1.8,
                    borderDash: [6, 4],
                    stepped: 'before',
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    spanGaps: true
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { boxWidth: 12, font: { size: 12 } } },
                title: {
                    display: true,
                    text: `FW1 当年 / FW2 下一年 ${metricLabel}（单位：亿元${isElastic ? ' · 弹性视图' : ''}）`,
                    align: 'start',
                    color: '#2c3e50',
                    font: { size: 13, weight: '600' }
                },
                tooltip: {
                    callbacks: {
                        title: items => items[0]?.label || '',
                        label: item => {
                            const row = globalData[item.dataIndex];
                            const year = item.datasetIndex === 0 ? row?.year : row?.fw2year;
                            const rawValue = item.datasetIndex === 0
                                ? fw1RawData[item.dataIndex]
                                : fw2RawData[item.dataIndex];
                            return `${item.dataset.label}: ${rawValue?.toLocaleString('zh-CN') ?? '-'} 亿（${year || '-'}年）`;
                        },
                        afterBody: items => {
                            const index = items[0]?.dataIndex;
                            const fw1 = fw1RawData[index];
                            const fw2 = fw2RawData[index];
                            if (!(fw1 > 0) || !(fw2 > 0)) return '';
                            const multiple = fw2 / fw1;
                            const growth = (multiple - 1) * 100;
                            return `下一年 / 当年：${multiple.toFixed(2)} 倍（${growth >= 0 ? '+' : ''}${growth.toFixed(0)}%）`;
                        }
                    }
                },
                zoom: {
                    limits: { x: { min: 'original', max: 'original' } },
                    pan: {
                        enabled: true,
                        mode: 'x',
                        onPanComplete: ({ chart }) => syncSharedChartRangeFrom(chart)
                    },
                    zoom: {
                        wheel: { enabled: true },
                        pinch: { enabled: true },
                        mode: 'x',
                        onZoomComplete: ({ chart }) => syncSharedChartRangeFrom(chart)
                    }
                }
            },
            scales: {
                x: {
                    type: 'time',
                    time: { unit: 'month', tooltipFormat: 'yyyy-MM-dd' },
                    grid: { display: false },
                    ticks: { font: { size: 10 }, maxRotation: 0 }
                },
                y: {
                    title: { display: true, text: metricAxisLabel },
                    ticks: {
                        callback: value => formatFinancialAxisValue(isElastic ? fromElasticScale(value) : value)
                    },
                    grace: '10%'
                }
            }
        },
        plugins: [crosshairPlugin]
    });
    scheduleSharedXAxisLayout();
}

window.setForecastHistoryMetric = function(metric, evt) {
    forecastHistoryMetric = metric === 'prof' ? 'prof' : 'rev';
    document.querySelectorAll('.metric-switch button').forEach(btn => btn.classList.remove('active'));
    const clickedBtn = evt?.currentTarget || document.getElementById(forecastHistoryMetric === 'rev' ? 'btn-history-rev' : 'btn-history-prof');
    if (clickedBtn) clickedBtn.classList.add('active');
    renderForecastHistoryChart();
};

window.setForecastHistoryScale = function(scale, evt) {
    const mode = scale === 'elastic' ? 'elastic' : 'linear';
    forecastHistoryScaleByMetric[forecastHistoryMetric] = mode;
    document.querySelectorAll('.forecast-history-scale button').forEach(btn => btn.classList.remove('active'));
    const clickedBtn = evt?.currentTarget || document.getElementById(mode === 'elastic' ? 'btn-history-elastic' : 'btn-history-linear');
    if (clickedBtn) clickedBtn.classList.add('active');
    renderForecastHistoryChart();
};

function renderTable() {
    const tbody = document.querySelector('#dataTable tbody');
    tbody.innerHTML = '';

    const rows = [...globalData].reverse().filter(d => d.pe !== undefined && d.pe !== null);

    if (rows.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('dataTable').style.display  = 'none';
        document.getElementById('rangeSelectorContainer').style.display = 'none';
        return;
    }
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('dataTable').style.display  = 'table';
    document.getElementById('rangeSelectorContainer').style.display = 'flex';

    rows.slice(0, 500).forEach(d => {
        const peStr = d.pe > 0
            ? `<span class="val-pe">${d.pe.toFixed(2)}</span>`
            : `<span class="loss">亏损</span>`;
        const psStr    = `<span class="val-ps">${(d.ps || 0).toFixed(2)}</span>`;
        const tagClass = d.sourceType === 'real' ? 'tag-real' : 'tag-manual';
        const editAttr = d.sourceType === 'manual' ? `onclick="editYearData(${d.year})" title="点击编辑"` : '';
        const editIcon = d.sourceType === 'manual' ? ' ✎' : '';

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${d.date}</td>
            <td>${d.price.toFixed(2)}</td>
            <td><span class="tag ${tagClass}" ${editAttr}>${d.sourceName}${editIcon}</span></td>
            <td>${(d.mktCap / 1e8).toFixed(1)}</td>
            <td>${(d.rev  / 1e8).toFixed(1)}</td>
            <td class="${d.prof > 0 ? '' : 'loss'}">${(d.prof / 1e8).toFixed(1)}</td>
            <td>${peStr}</td>
            <td>${psStr}</td>`;
        tbody.appendChild(tr);
    });
}
